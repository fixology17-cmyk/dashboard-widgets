<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f9fb; --card: #ffffff; --text: #1b1f27; --text2: #5f6980; --text3: #9aa3b4;
    --border: #e8ecf2; --accent: #1877f2; --accent-light: #e7f0ff; --green: #34a853;
    --green-light: #e6f4ea; --red: #ea4335; --amber: #fbbc04; --amber-light: #fef7e0;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 24px; -webkit-font-smoothing: antialiased; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
  .header-left h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
  .header-left p { font-size: 13px; color: var(--text3); margin-top: 3px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px; white-space: nowrap; }
  .badge-fb { background: var(--accent-light); color: var(--accent); }
  .badge-gray { background: var(--card); border: 1px solid var(--border); color: var(--text3); font-weight: 500; font-size: 11px; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); transition: transform 0.15s, box-shadow 0.15s; }
  .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .kpi-card .kpi-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 12px; }
  .kpi-card .kpi-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi-card .kpi-value { font-size: 28px; font-weight: 800; margin-top: 4px; line-height: 1; }
  .kpi-card .kpi-sub { font-size: 12px; color: var(--text3); margin-top: 6px; }
  .kpi-card.main { background: var(--accent); border-color: var(--accent); }
  .kpi-card.main .kpi-label, .kpi-card.main .kpi-value, .kpi-card.main .kpi-sub { color: #fff; }
  .kpi-card.main .kpi-icon { background: rgba(255,255,255,0.2); color: #fff; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .panel h3 { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
  .chart-container { width: 100%; height: 200px; }
  .chart-container svg { width: 100%; height: 100%; overflow: visible; }
  .posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .post-card { background: #f9fafb; border-radius: 8px; padding: 14px; border: 1px solid var(--border); }
  .post-card .post-date { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
  .post-card .post-text { font-size: 12px; color: var(--text); line-height: 1.4; max-height: 60px; overflow: hidden; margin-bottom: 8px; }
  .post-card .post-stats { display: flex; gap: 12px; font-size: 11px; color: var(--text2); font-weight: 600; }
  .loading-screen { display: flex; flex-direction: column; align-items: center; padding: 80px; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--text3); }
  .error-screen { text-align: center; padding: 60px; color: var(--red); font-size: 14px; }
  @media (max-width: 900px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } .two-col { grid-template-columns: 1fr; } .posts-grid { grid-template-columns: 1fr; } body { padding: 16px; } }
</style>
</head>
<body>
<div id="app">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Loading Facebook page data...</div>
  </div>
</div>
<script>
var PAGE_TOKEN = 'EAAOfPIWIQLgBRoTcZCV2XUni15mBw9ZB2MzlzdZA99fus6v9voYxblUUYxZA4iM0eNGP2lFuy6lVDV8jMRyu2jZC4FMq5EHLQRcATvuJ6ocUkmeo89KdIuOZCDCuQwWHgQOGL2SpMpP0IBNsivKBfjPb5N0NVZAPZCHQ4ZB1MSZCAqrBGHOGjNRZCdAsGGJ1DxWFOKJZB9KTsW9rxZAneygEmBH6OfwZDZD';
var PAGE_ID = '143566877782';
var API = 'https://graph.facebook.com/v25.0';

function fmtDate(d) {
  if (!d) return '';
  var dt = new Date(d);
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[dt.getMonth()] + ' ' + dt.getDate();
}

function fmtNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return String(n);
}

function chartSVG(data, w, h, color) {
  if (!data.length) return '<div style="text-align:center;padding:30px;color:#9aa3b4;font-size:13px;">No data</div>';
  var vals = data.map(function(d) { return d.value; });
  var max = Math.max.apply(null, vals.concat([1]));
  var padTop = 25, padBot = 30, chartH = h - padTop - padBot;
  var gap = 3;
  var barW = Math.max(6, (w - data.length * gap) / data.length);
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" style="font-family:Plus Jakarta Sans,sans-serif">';
  for (var g = 0; g <= 4; g++) {
    var gy = padTop + (chartH / 4) * g;
    svg += '<line x1="0" y1="' + gy + '" x2="' + w + '" y2="' + gy + '" stroke="#f0f2f5" stroke-width="0.5"/>';
    if (g === 0 || g === 4) {
      var gval = Math.round(max - (max / 4) * g);
      svg += '<text x="4" y="' + (gy - 4) + '" font-size="7" fill="#bbb">' + fmtNum(gval) + '</text>';
    }
  }
  vals.forEach(function(v, i) {
    var bh = max > 0 ? (v / max) * chartH : 0;
    if (v > 0 && bh < 2) bh = 2;
    var x = i * (barW + gap);
    var y = padTop + chartH - bh;
    svg += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + bh + '" rx="2" fill="' + color + '" opacity="0.8"><title>' + fmtDate(data[i].date) + ': ' + v + '</title></rect>';
    if (i % 4 === 0 && v > 0) svg += '<text x="' + (x + barW/2) + '" y="' + (y - 4) + '" text-anchor="middle" font-size="7" font-weight="700" fill="' + color + '">' + fmtNum(v) + '</text>';
    if (i % 5 === 0 || i === data.length - 1) svg += '<text x="' + (x + barW/2) + '" y="' + (h - 8) + '" text-anchor="middle" font-size="7" fill="#9aa3b4">' + fmtDate(data[i].date) + '</text>';
  });
  svg += '<line x1="0" y1="' + (padTop + chartH) + '" x2="' + w + '" y2="' + (padTop + chartH) + '" stroke="#e8ecf2" stroke-width="1"/>';
  svg += '</svg>';
  return svg;
}

function extractMetric(insights, name) {
  if (!insights || !insights.data) return [];
  var found = insights.data.filter(function(d) { return d.name === name; });
  if (!found.length) return [];
  return (found[0].values || []).map(function(v) { return { date: v.end_time, value: v.value || 0 }; });
}

function sumArr(arr) { return arr.reduce(function(s, d) { return s + d.value; }, 0); }

async function init() {
  var app = document.getElementById('app');
  try {
    // Get page info with permanent page token
    var ptResp = await fetch(API + '/' + PAGE_ID + '?fields=id,name,fan_count,followers_count&access_token=' + PAGE_TOKEN);
    var ptData = await ptResp.json();
    if (ptData.error) throw new Error(ptData.error.message);
    
    var pageToken = PAGE_TOKEN;
    var fanCount = ptData.fan_count || 0;
    var followers = ptData.followers_count || 0;
    var pageName = ptData.name || 'Facebook Page';
    
    // Get insights with page token (New Pages Experience compatible metrics)
    var since = Math.floor(Date.now()/1000) - 28*86400;
    var insResp = await fetch(API + '/' + PAGE_ID + '/insights?metric=page_post_engagements,page_views_total,page_impressions_unique&period=day&since=' + since + '&access_token=' + pageToken);
    var insights = await insResp.json();
    
    var engagementData = extractMetric(insights, 'page_post_engagements');
    var viewsData = extractMetric(insights, 'page_views_total');
    var reachData = extractMetric(insights, 'page_impressions_unique');
    
    var totalEngagement = sumArr(engagementData);
    var totalViews = sumArr(viewsData);
    var totalReach = sumArr(reachData);
    
    // Get posts
    var postsResp = await fetch(API + '/' + PAGE_ID + '/posts?fields=message,created_time,likes.summary(true),comments.summary(true),shares&limit=9&access_token=' + pageToken);
    var postsData = await postsResp.json();
    var posts = (postsData.data || []).map(function(p) {
      return { message: (p.message || '').substring(0, 120), date: p.created_time, likes: p.likes ? p.likes.summary.total_count : 0, comments: p.comments ? p.comments.summary.total_count : 0, shares: p.shares ? p.shares.count : 0 };
    });
    
    var html = '';
    html += '<div class="header"><div class="header-left"><h1>Facebook Page Stats</h1>';
    html += '<p>' + pageName + ' \u00b7 Last 28 Days</p></div>';
    html += '<div class="header-right"><span class="badge badge-fb">\uD83D\uDC4D ' + fmtNum(fanCount) + ' likes</span>';
    html += '<span class="badge badge-gray">' + fmtNum(followers) + ' followers</span></div></div>';
    
    html += '<div class="kpi-row">';
    html += '<div class="kpi-card main"><div class="kpi-icon" style="background:rgba(255,255,255,0.2);color:#fff">\uD83D\uDC65</div>';
    html += '<div class="kpi-label">Page Likes</div><div class="kpi-value">' + fmtNum(fanCount) + '</div>';
    html += '<div class="kpi-sub">' + fmtNum(followers) + ' followers</div></div>';
    
    html += '<div class="kpi-card"><div class="kpi-icon" style="background:var(--accent-light);color:var(--accent)">\uD83D\uDC41</div>';
    html += '<div class="kpi-label">Reach</div><div class="kpi-value">' + fmtNum(totalReach) + '</div>';
    html += '<div class="kpi-sub">unique impressions</div></div>';
    
    html += '<div class="kpi-card"><div class="kpi-icon" style="background:var(--green-light);color:var(--green)">\u2764\uFE0F</div>';
    html += '<div class="kpi-label">Engagements</div><div class="kpi-value">' + fmtNum(totalEngagement) + '</div>';
    html += '<div class="kpi-sub">likes, comments, shares</div></div>';
    
    html += '<div class="kpi-card"><div class="kpi-icon" style="background:var(--amber-light);color:var(--amber)">\uD83D\uDCF1</div>';
    html += '<div class="kpi-label">Page Views</div><div class="kpi-value">' + fmtNum(totalViews) + '</div>';
    html += '<div class="kpi-sub">profile visits</div></div>';
    html += '</div>';
    
    html += '<div class="two-col">';
    html += '<div class="panel"><h3>Daily Reach</h3><div class="chart-container">' + chartSVG(reachData, 500, 200, '#1877f2') + '</div></div>';
    html += '<div class="panel"><h3>Daily Engagements</h3><div class="chart-container">' + chartSVG(engagementData, 500, 200, '#34a853') + '</div></div>';
    html += '</div>';
    
    html += '<div class="panel" style="margin-bottom:20px"><h3>Daily Page Views</h3><div class="chart-container">' + chartSVG(viewsData, 500, 200, '#ea4335') + '</div></div>';
    
    if (posts.length > 0) {
      html += '<div class="panel"><h3>Recent Posts (' + posts.length + ')</h3><div class="posts-grid">';
      posts.forEach(function(p) {
        html += '<div class="post-card">';
        html += '<div class="post-date">' + fmtDate(p.date) + '</div>';
        html += '<div class="post-text">' + (p.message || '<em>Photo/video post</em>') + '</div>';
        html += '<div class="post-stats"><span>\u2764\uFE0F ' + p.likes + '</span><span>\uD83D\uDCAC ' + p.comments + '</span><span>\uD83D\uDD01 ' + p.shares + '</span></div>';
        html += '</div>';
      });
      html += '</div></div>';
    }
    
    app.innerHTML = html;
  } catch(e) {
    app.innerHTML = '<div class="error-screen">Failed to load Facebook data.<br><br><small>' + e.message + '</small><br><br><span style="color:#5f6980;font-size:12px;">Token may have expired. Regenerate at developers.facebook.com/tools/explorer/</span></div>';
  }
}
init();
</script>
</body>
</html>
